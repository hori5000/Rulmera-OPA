name: Bootstrap Rulmera OPA baseline

on:
  push:
    branches: [main]
    paths:
      - '_IMPORT/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild payload archive
        shell: bash
        run: |
          set -euo pipefail
          test -f _IMPORT/READY
          cat _IMPORT/part-*.b64 | tr -d '\r\n' | base64 -d > /tmp/payload.zip
          unzip -t /tmp/payload.zip >/dev/null
          rm -rf /tmp/import
          mkdir -p /tmp/import
          unzip -q /tmp/payload.zip -d /tmp/import
          test -d /tmp/import/Rulmera-OPA

      - name: Replace main with reviewed Obsidian baseline
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=/tmp/import/Rulmera-OPA
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan clean-main
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$PAYLOAD"/. .
          git add -A
          git commit -m "Baseline: Rulmera OPA Obsidian clean review v0.1"
          git push --force origin clean-main:main
